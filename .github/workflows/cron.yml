name: Tracker Xbox 24/7

on:
  schedule:
    - cron: '*/15 * * * *' # Se ejecuta cada 15 minutos
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Tracker
        run: python tracker.py

      - name: Guardar historial de vistos
        run: |
          git config --global user.name "Bot Tracker"
          git config --global user.email "bot@tracker.local"
          git add xbox_vistos.txt
          git commit -m "Actualizar historial de precios" || exit 0
          git push