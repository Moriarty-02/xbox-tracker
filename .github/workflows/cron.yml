name: Tracker Xbox 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write # Permite al bot guardar el historial en el repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Tracker
        run: python tracker.py

      - name: Guardar historial de vistos
        run: |
          touch xbox_vistos.txt
          git config --global user.name "Bot Tracker"
          git config --global user.email "bot@tracker.local"
          git add xbox_vistos.txt
          git commit -m "Actualizar historial de precios" || exit 0
          git push
